[project]
name = "ai-service"
version = "0.1.0"
description = "AI Trading Discipline Copilot Service (Agents 1-6)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "langchain>=0.1.13",
    "langgraph>=0.0.30",
    "langchain-google-genai>=1.0.1",
    "pydantic>=2.6.4",
    "python-dotenv>=1.0.1",
    "newsapi-python>=0.2.7",
    "tweepy>=4.14.0",
    "praw>=7.7.1",
    "duckduckgo-search>=5.2.1",
    "psycopg2-binary>=2.9",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29.0",
    "pandas>=2.2.0",
    "pandas-ta>=0.3.14b0",
    "numpy>=1.26.0",
    "pydantic-settings>=2.4.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "yfinance>=0.2.35",
    "qdrant-client>=1.8.0",
    "fastembed>=0.2.0",
    "alembic>=1.13.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
]

[tool.ruff]
target-version = "py313"
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.13"
explicit_package_bases = true
warn_return_any = false
warn_unused_configs = true
check_untyped_defs = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "src.agent1_graph",
    "src.agent2_graph",
    "src.agent3_graph",
    "src.database",
    "src.execution_service",
    "src.risk_service",
    "src.rag.*",
    "src.routers.*"
]
ignore_errors = true

[tool.pytest.ini_options]
pythonpath = ["."]



