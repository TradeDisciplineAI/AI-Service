# ------------------ Pre-commit Hooks Configuration -----------------------
# Enforces automated linting, formatting, type-checking, and file sanitization
# before every git commit across the repository.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        additional_dependencies: [pydantic>=2.6.4, fastapi>=0.110.0, sqlalchemy>=2.0]
        args: [--config-file=pyproject.toml]
