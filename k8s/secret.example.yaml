# ------------------ Kubernetes Secret Template (Example) -----------------------
# Secrets store sensitive API keys, database connection strings, and LLM credentials.
# DO NOT commit real production passwords or API keys to git repositories!
# Copy this template to 'secret.yaml' before running 'kubectl apply'.
# --------------------------------------------------------------------------

apiVersion: v1
kind: Secret
metadata:
  name: ai-service-secret
  namespace: ai-service
  labels:
    app: ai-service
    component: secret
type: Opaque
stringData:
  # ------------------ PostgreSQL Database Connection String -----------------------
  DATABASE_URL: "postgresql+asyncpg://user:password@shared_test_db:5432/trading_db"

  # ------------------ LLM Provider API Keys -----------------------
  GOOGLE_API_KEY: "your-google-gemini-api-key-here"
  OPENAI_API_KEY: "your-openai-api-key-here"
  NEWS_API_KEY: "your-news-api-key-here"

  # ------------------ Qdrant Vector DB API Secret -----------------------
  QDRANT_API_KEY: "your-qdrant-api-key-optional"

  # ------------------ Internal API Authentication Secret -----------------------
  INTERNAL_API_SECRET: "your-internal-api-secret-key-change-in-prod"
