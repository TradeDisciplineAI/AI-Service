version: '3.8'

services:
  ai-service:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: ai-service
    ports:
      - "8002:8000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
